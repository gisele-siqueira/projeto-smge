spring.application.name=smge

# Banco H2 (desenvolvimento)
spring.datasource.url=jdbc:h2:mem:smge
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# Conta ADMIN inicial (criada só se não existir nenhum ADMIN).
# Em produção, defina as variáveis de ambiente SMGE_ADMIN_LOGIN e SMGE_ADMIN_SENHA.
smge.admin.nome=Administrador
smge.admin.login=${SMGE_ADMIN_LOGIN:admin}
smge.admin.senha=${SMGE_ADMIN_SENHA:Admin@123}

# JWT
# O segredo assina os tokens: mínimo de 32 caracteres.
# Em produção, defina SMGE_JWT_SEGREDO com um valor aleatório e diferente para cada empresa.
smge.jwt.segredo=${SMGE_JWT_SEGREDO:dev-somente-local-troque-em-producao-0123456789}
smge.jwt.validade-horas=${SMGE_JWT_VALIDADE_HORAS:8}

# CORS: origens do front-end autorizadas a chamar a API (separadas por vírgula)
smge.cors.origens=${SMGE_CORS_ORIGENS:http://localhost:5173}
