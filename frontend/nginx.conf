server {
    listen 80;
    server_name localhost;

    # Habilita compressão Gzip para arquivos estáticos
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Raiz dos arquivos estáticos compilados do frontend
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Suporte a SPA (Single Page Application - React Router):
    # Qualquer rota não encontrada no sistema de arquivos é direcionada ao index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache de longa duração para assets estáticos versionados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy reverso para o backend Spring Boot
    # Redireciona chamadas /api para o serviço 'backend' na porta 8080
    location /api {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        # Headers de encaminhamento
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts adequados
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
